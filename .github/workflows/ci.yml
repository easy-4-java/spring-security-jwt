# CI workflow for the main line (JDK 17)
#
# Triggers:
#   - push / pull_request on the main branch
#   - manual workflow_dispatch
#
# Runs `mvn -B clean verify` which includes the JaCoCo coverage gate
# (90% line coverage, haltOnFailure=false) configured in the POM.
#
# The POM and pinned sibling revisions use Maven modelVersion 4.0.0.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: JDK 17 Build & Verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Remove checkout build artifacts on runner
        run: python3 .github/scripts/run_verify.py --clean-only

      - name: Test report provenance helper
        run: python3 .github/scripts/test_run_verify.py

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build pinned public Easy4J snapshot sources
        run: |
          set -euo pipefail
          dependency_root="${RUNNER_TEMP}/easy4j-dependencies"
          mkdir -p "${dependency_root}"
          # Fixed public revisions: changing a sibling main must not silently
          # change the snapshot classes tested by this repository.
          while read -r dependency revision; do
            git init "${dependency_root}/${dependency}"
            git -C "${dependency_root}/${dependency}" remote add origin "https://github.com/easy-4-java/${dependency}.git"
            git -C "${dependency_root}/${dependency}" fetch --depth 1 origin "${revision}"
            git -C "${dependency_root}/${dependency}" checkout --detach FETCH_HEAD
            test "$(git -C "${dependency_root}/${dependency}" rev-parse HEAD)" = "${revision}"
            mvn -B --no-transfer-progress -s .mvn/ci-settings.xml -f "${dependency_root}/${dependency}/pom.xml" -Dgpg.skip=true clean install
          done <<'SOURCES'
          jwt-issuer a8aab19df8ca0a703bec0d27e245e8abc67e1956
          spring-security-extension 1c58ecfbbf02b5c61efbe66b7336e29f43bac4ce
          SOURCES

      - name: Build and verify with JaCoCo coverage gate
        id: project_verify
        run: python3 .github/scripts/run_verify.py

      - name: Upload JaCoCo coverage report
        if: ${{ always() && steps.project_verify.outputs.jacoco == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-coverage
          path: target/site/jacoco
          if-no-files-found: error
          retention-days: 14

      - name: Upload surefire reports
        if: ${{ always() && steps.project_verify.outputs.surefire == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: target/surefire-reports
          if-no-files-found: error
          retention-days: 14
